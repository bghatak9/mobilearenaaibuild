version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: mobilearena_postgres
    restart: always
    environment:
      POSTGRES_USER: mobilearena
      POSTGRES_PASSWORD: mobilearena123
      POSTGRES_DB: mobilearena_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mobilearena_redis
    restart: always
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mobilearena_meili
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-mobilearena_meili_dev_key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  backend:
    build:
      context: ./apps/backend
    container_name: mobilearena_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - meilisearch
    environment:
      DATABASE_URL: postgresql://mobilearena:mobilearena123@postgres:5432/mobilearena_db?schema=public
      JWT_SECRET: change-me-in-production
      REDIS_URL: redis://redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-mobilearena_meili_dev_key}
      SOCIAL_AUTH_DEV_MODE: ${SOCIAL_AUTH_DEV_MODE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # Optional error tracking — passed through from the host if set.
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: mobilearena_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  meili_data: